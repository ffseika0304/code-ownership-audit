<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- code brackets: the subject under examination -->
  <g stroke="#64748b" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M170 150 L104 256 L170 362"/>
    <path d="M342 150 L408 256 L342 362"/>
  </g>

  <!-- diagonal: the line separating original from derived -->
  <path d="M300 132 L212 380" stroke="#475569" stroke-width="20" stroke-linecap="round"/>

  <!-- verification seal -->
  <circle cx="256" cy="256" r="96" fill="url(#seal)"/>
  <path d="M212 258 L242 288 L302 226" stroke="#f8fafc" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
